<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#152238" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b1117" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="muscleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#f43f5e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="secGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#526075"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Seamless Dark UI Canvas -->
  <rect width="400" height="260" fill="url(#bgGlow)"/>
  <!-- Subtle perspective studio floor -->
  <ellipse cx="200" cy="228" rx="155" ry="12" fill="#060a0f" opacity="0.85"/>
  <line x1="36" y1="226" x2="364" y2="226" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Anatomical Figure & Equipment Scene -->
  
      <!-- Legs (slight knee bend) -->
      <path d="M174,126 L192,176 L186,221" stroke="url(#bodyGrad)" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="182" y1="221" x2="210" y2="221" stroke="#06b6d4" stroke-width="7" stroke-linecap="round"/>

      <!-- PRIMARY MUSCLE HIGHLIGHT: Hamstrings & Glutes -->
      <ellipse cx="172" cy="130" rx="18" ry="15" fill="url(#muscleGlow)" opacity="0.78" filter="url(#softGlow)"/>
      <path d="M170,138 L184,176" stroke="#f43f5e" stroke-width="11" stroke-linecap="round" opacity="0.78" filter="url(#softGlow)"/>

      <!-- Secondary: Lower Back -->
      <ellipse cx="196.9237262251469" cy="102.2617865888245" rx="14" ry="8" fill="url(#secGlow)" opacity="0.585"/>

      <!-- Torso -->
      <line x1="174" y1="126" x2="219.84745245029382" y2="78.52357317764901" stroke="url(#bodyGrad)" stroke-width="20" stroke-linecap="round"/>

      <!-- Head -->
      <circle cx="235.12993660039174" cy="62.698097570198684" r="13" fill="url(#bodyGrad)" stroke="#64748b" stroke-width="1.5"/>
      
    <path d="M224.12993660039174,59.698097570198684 Q235.12993660039174,45.698097570198684 246.12993660039174,59.698097570198684 Z" fill="#1e293b"/>
    <path d="M225.12993660039174,58.698097570198684 Q211.12993660039174,56.698097570198684 209.12993660039174,70.69809757019868 Q217.12993660039174,66.69809757019868 225.12993660039174,62.698097570198684 Z" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  

      <!-- Arms hanging vertical to Barbell -->
      <line x1="219.84745245029382" y1="82.52357317764901" x2="225.84745245029382" y2="146.523573177649" stroke="#475569" stroke-width="11" stroke-linecap="round"/>
      <circle cx="225.84745245029382" cy="146.523573177649" r="22" fill="#0f172a" stroke="#06b6d4" stroke-width="3.5"/>
      <circle cx="225.84745245029382" cy="146.523573177649" r="7" fill="#334155"/>
    

  <!-- Subtle Phase / Muscle Telemetry Bar -->
  <g opacity="0.9">
    <rect x="14" y="14" width="108" height="22" rx="11" fill="#0f172a" stroke="#1e293b"/>
    <circle cx="26" cy="25" r="3.5" fill="#f43f5e"/>
    <text x="35" y="29" fill="#e2e8f0" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700">FASE 2/4</text>
  </g>
</svg>