<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#152238" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b1117" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="muscleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#f43f5e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="secGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#526075"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Seamless Dark UI Canvas -->
  <rect width="400" height="260" fill="url(#bgGlow)"/>
  <!-- Subtle perspective studio floor -->
  <ellipse cx="200" cy="228" rx="155" ry="12" fill="#060a0f" opacity="0.85"/>
  <line x1="36" y1="226" x2="364" y2="226" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Anatomical Figure & Equipment Scene -->
  
      <!-- Rear Bench -->
      <rect x="86" y="168" width="54" height="56" rx="8" fill="#111827" stroke="#334155" stroke-width="2"/>

      <!-- Rear Elevated Leg -->
      <path d="M188,128 L160,162 L118,166" stroke="#293548" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="112" y1="166" x2="124" y2="166" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>

      <!-- Front Working Leg -->
      <path d="M196,128 L246,166 L242,220" stroke="url(#bodyGrad)" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="238" y1="221" x2="266" y2="221" stroke="#06b6d4" stroke-width="7" stroke-linecap="round"/>

      <!-- PRIMARY MUSCLE HIGHLIGHT: Front Quad & Glute -->
      <path d="M198,130 L242,162" stroke="#f43f5e" stroke-width="12" stroke-linecap="round" opacity="0.4" filter="url(#softGlow)"/>
      <ellipse cx="192" cy="130" rx="17" ry="14" fill="url(#muscleGlow)" opacity="0.36000000000000004" filter="url(#softGlow)"/>

      <!-- Sculpted Torso (slight athletic lean) -->
      <path d="M196,76 L212,82 L204,132 L184,128 Z"
            fill="url(#bodyGrad)" stroke="#64748b" stroke-width="1.5"/>

      <!-- Head -->
      <circle cx="206" cy="48" r="13" fill="url(#bodyGrad)" stroke="#64748b" stroke-width="1.5"/>
      
    <path d="M195,45 Q206,31 217,45 Z" fill="#1e293b"/>
    <path d="M196,44 Q182,42 180,56 Q188,52 196,48 Z" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  

      <!-- Arms + Dumbbells -->
      <path d="M202,84 L214,154" stroke="#475569" stroke-width="11" stroke-linecap="round"/>
      <rect x="200" y="152" width="28" height="10" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5"/>
    

  <!-- Subtle Phase / Muscle Telemetry Bar -->
  <g opacity="0.9">
    <rect x="14" y="14" width="108" height="22" rx="11" fill="#0f172a" stroke="#1e293b"/>
    <circle cx="26" cy="25" r="3.5" fill="#f43f5e"/>
    <text x="35" y="29" fill="#e2e8f0" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700">FASE 1/4</text>
  </g>
</svg>