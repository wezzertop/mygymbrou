<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#152238" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b1117" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="muscleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#f43f5e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="secGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#526075"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Seamless Dark UI Canvas -->
  <rect width="400" height="260" fill="url(#bgGlow)"/>
  <!-- Subtle perspective studio floor -->
  <ellipse cx="200" cy="228" rx="155" ry="12" fill="#060a0f" opacity="0.85"/>
  <line x1="36" y1="226" x2="364" y2="226" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Anatomical Figure & Equipment Scene -->
  
      <circle cx="200" cy="48" r="13" fill="url(#bodyGrad)" stroke="#64748b" stroke-width="1.5"/>
      
    <path d="M189,45 Q200,31 211,45 Z" fill="#1e293b"/>
    <path d="M190,44 Q176,42 174,56 Q182,52 190,48 Z" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  
      <path d="M180,66 L220,66 L216,138 L184,138 Z" fill="url(#bodyGrad)" stroke="#64748b" stroke-width="1.5"/>
      <line x1="190" y1="138" x2="184" y2="220" stroke="url(#bodyGrad)" stroke-width="18" stroke-linecap="round"/>
      <line x1="210" y1="138" x2="216" y2="220" stroke="url(#bodyGrad)" stroke-width="18" stroke-linecap="round"/>

      <!-- Left & Right Arms Raising -->
      <line x1="180" y1="74" x2="133.07701432625305" y2="108.09154463296343" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
      <line x1="220" y1="74" x2="266.92298567374695" y2="108.09154463296343" stroke="#475569" stroke-width="10" stroke-linecap="round"/>

      <!-- PRIMARY MUSCLE HIGHLIGHT: Lateral Deltoids -->
      <circle cx="180" cy="74" r="13" fill="url(#muscleGlow)" opacity="0.8" filter="url(#softGlow)"/>
      <circle cx="220" cy="74" r="13" fill="url(#muscleGlow)" opacity="0.8" filter="url(#softGlow)"/>

      <!-- Dumbbells -->
      <circle cx="133.07701432625305" cy="108.09154463296343" r="8" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5"/>
      <circle cx="266.92298567374695" cy="108.09154463296343" r="8" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5"/>
    

  <!-- Subtle Phase / Muscle Telemetry Bar -->
  <g opacity="0.9">
    <rect x="14" y="14" width="108" height="22" rx="11" fill="#0f172a" stroke="#1e293b"/>
    <circle cx="26" cy="25" r="3.5" fill="#f43f5e"/>
    <text x="35" y="29" fill="#e2e8f0" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700">FASE 2/3</text>
  </g>
</svg>